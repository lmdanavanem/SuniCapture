name: macOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify macOS universal
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build universal app, run core checks and package DMG
        run: ./scripts/build-macos.sh

      - name: Verify package
        run: |
          shasum -a 256 -c SHA256SUMS-macos.txt
          lipo -archs SuniCapture.app/Contents/MacOS/SuniCapture | grep -q arm64
          lipo -archs SuniCapture.app/Contents/MacOS/SuniCapture | grep -q x86_64
          codesign --verify --strict SuniCapture.app
          SuniCapture.app/Contents/MacOS/SuniCapture --version
        working-directory: dist

      - name: Upload macOS distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SuniCapture-macos-universal
          path: |
            dist/*.dmg
            dist/SHA256SUMS-macos.txt
          if-no-files-found: error

      - name: Upload core verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-macos
          path: artifacts/macos-checks/**/report.json
          if-no-files-found: ignore
